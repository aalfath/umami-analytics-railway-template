# Local test only. On Railway, the template uses Railway's own Postgres.
services:
  umami:
    build: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami-local@db:5432/umami
      APP_SECRET: change-me-local-only-0123456789abcdef
      ADMIN_PASSWORD: local-admin-password
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami-local
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  umami-db:
